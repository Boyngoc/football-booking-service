spring.application.name=field-service
app.owner=Hung
server.port=8082

app.security.mode=open
app.jwt.secret=football-booking-secret-key-doi-truoc-khi-nop-bai-1234567890

# ---- Quy tac nghiep vu san bong -----------------------------
# Gio mo cua cua cum san
app.field.open-time=05:00
app.field.close-time=23:00
# Khung gio vang va he so nhan gia
app.field.golden-start=17:00
app.field.golden-end=21:00
app.field.golden-rate=1.5

# ---- CSDL rieng cua field-service ---------------------------
spring.datasource.url=jdbc:h2:file:./data/field_db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Nap du lieu mau 4 san tu data.sql sau khi Hibernate tao bang xong
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.jackson.serialization.write-dates-as-timestamps=false
