spring.application.name=field-service
app.owner=Hung
server.port=8082

app.security.mode=open
app.jwt.secret=football-booking-secret-key-doi-truoc-khi-nop-bai-1234567890

# ---- Quy tac nghiep vu san bong -----------------------------
# Gio mo cua cua cum san
app.field.open-time=05:00
app.field.close-time=23:00
# Khung gio vang - phut nao roi vao [golden-start, golden-end) thi tinh theo
# cot golden_price_per_hour cua san, phut con lai tinh theo price_per_hour.
# Gia cu the nam o bang fields, khong dat he so o day de moi san mot muc gia rieng.
app.field.golden-start=17:00
app.field.golden-end=21:00

# ---- CSDL rieng cua field-service ---------------------------
spring.datasource.url=jdbc:h2:file:./data/field_db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Du lieu mau 4 san do DataSeeder (Java) nap, chay duoc tren ca H2 lan MySQL
# va chi nap khi bang con rong -> khoi dong lai khong bi trung ban ghi.

spring.jackson.serialization.write-dates-as-timestamps=false
