# ============================================================
# auth-service  -  cong 8080  -  chu so huu: HOANG
# ============================================================
spring.application.name=auth-service
app.owner=Hoang
server.port=8080

# ---- Bao mat -------------------------------------------------
# open = mo het (giai doan dung base, de goi Postman)
# jwt  = bat JWT that, doi sang gia tri nay khi Hoang lam xong SecurityConfig
app.security.mode=open

# Khoa ky JWT - dung CHUNG cho ca 4 service, doi thi phai doi dong loat
app.jwt.secret=football-booking-secret-key-doi-truoc-khi-nop-bai-1234567890
app.jwt.expiration-ms=3600000

# ---- CSDL rieng cua auth-service ----------------------------
# Mac dinh dung H2 ghi ra file de chay duoc ngay, khong can cai MySQL.
# Khi demo thi chay voi profile mysql (xem application-mysql.properties).
spring.datasource.url=jdbc:h2:file:./data/auth_db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- JSON ----------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
