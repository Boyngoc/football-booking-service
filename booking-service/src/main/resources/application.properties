# ============================================================
# booking-service  -  cong 8081  -  chu so huu: LINH
# ============================================================
spring.application.name=booking-service
app.owner=Linh
server.port=8081

app.security.mode=open
app.jwt.secret=football-booking-secret-key-doi-truoc-khi-nop-bai-1234567890

# ---- Dia chi dich vu khac (Hung dung cho phan giao tiep) ----
app.field-service.url=http://localhost:8082
app.client.connect-timeout-ms=2000
app.client.read-timeout-ms=3000

# ---- Quy tac nghiep vu dat san ------------------------------
app.booking.min-minutes=60
app.booking.max-minutes=180
app.booking.slot-step-minutes=30
app.booking.max-days-ahead=30
# Khong cho huy san khi con duoi so gio nay la den gio da
app.booking.cancel-before-hours=2

# ---- CSDL rieng cua booking-service -------------------------
spring.datasource.url=jdbc:h2:file:./data/booking_db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.jackson.serialization.write-dates-as-timestamps=false
