spring.application.name=payment-service
app.owner=Nhat
server.port=8083

app.security.mode=open
app.jwt.secret=football-booking-secret-key-doi-truoc-khi-nop-bai-1234567890

# ---- Dia chi dich vu khac -----------------------------------
# payment-service lay so tien bang cach GOI API nay,
# TUYET DOI khong tao datasource tro vao booking_db.
app.booking-service.url=http://localhost:8081
app.client.connect-timeout-ms=2000
app.client.read-timeout-ms=3000

# ---- CSDL rieng cua payment-service -------------------------
spring.datasource.url=jdbc:h2:file:./data/payment_db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.write-dates-as-timestamps=false
